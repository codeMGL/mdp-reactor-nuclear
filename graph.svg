<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>

  <!-- Nodos -->
  <!-- Posiciones en círculo -->
  <g id="nodes" fill="lightblue" stroke="black">
    <!-- Generados manualmente -->
    <circle cx="300" cy="100" r="15"/><text x="300" y="105" text-anchor="middle">1</text>
    <circle cx="420" cy="140" r="15"/><text x="420" y="145" text-anchor="middle">2</text>
    <circle cx="500" cy="250" r="15"/><text x="500" y="255" text-anchor="middle">3</text>
    <circle cx="500" cy="350" r="15"/><text x="500" y="355" text-anchor="middle">4</text>
    <circle cx="420" cy="460" r="15"/><text x="420" y="465" text-anchor="middle">5</text>
    <circle cx="300" cy="500" r="15"/><text x="300" y="505" text-anchor="middle">6</text>
    <circle cx="180" cy="460" r="15"/><text x="180" y="465" text-anchor="middle">7</text>
    <circle cx="100" cy="350" r="15"/><text x="100" y="355" text-anchor="middle">8</text>
    <circle cx="100" cy="250" r="15"/><text x="100" y="255" text-anchor="middle">9</text>
    <circle cx="180" cy="140" r="15"/><text x="180" y="145" text-anchor="middle">10</text>
  </g>

  <!-- Aristas -->
  <g id="edges" stroke="black" fill="none" marker-end="url(#arrow)">
    <!-- Para cada i, conecta con i-2, i-1, i, i+1, i+2 (si existen) -->

    <!-- Nodo 1 -->
    <line x1="300" y1="100" x2="420" y2="140"/>
    <line x1="300" y1="100" x2="500" y2="250"/>
    <path d="M300,100 C320,70 280,70 300,100"/> <!-- self-loop -->

    <!-- Nodo 2 -->
    <line x1="420" y1="140" x2="300" y2="100"/>
    <line x1="420" y1="140" x2="500" y2="250"/>
    <line x1="420" y1="140" x2="500" y2="350"/>
    <path d="M420,140 C440,110 400,110 420,140"/>

    <!-- Nodo 3 -->
    <line x1="500" y1="250" x2="300" y2="100"/>
    <line x1="500" y1="250" x2="420" y2="140"/>
    <line x1="500" y1="250" x2="500" y2="350"/>
    <line x1="500" y1="250" x2="420" y2="460"/>
    <path d="M500,250 C520,220 480,220 500,250"/>

    <!-- Nodo 4 -->
    <line x1="500" y1="350" x2="420" y2="140"/>
    <line x1="500" y1="350" x2="500" y2="250"/>
    <line x1="500" y1="350" x2="420" y2="460"/>
    <line x1="500" y1="350" x2="300" y2="500"/>
    <path d="M500,350 C520,320 480,320 500,350"/>

    <!-- Nodo 5 -->
