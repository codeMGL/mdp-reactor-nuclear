    <line x1="420" y1="460" x2="500" y2="350"/>
    <line x1="420" y1="460" x2="300" y2="500"/>
    <line x1="420" y1="460" x2="180" y2="460"/>
    <path d="M420,460 C440,430 400,430 420,460"/>

    <!-- Nodo 6 -->
    <line x1="300" y1="500" x2="500" y2="350"/>
    <line x1="300" y1="500" x2="420" y2="460"/>
    <line x1="300" y1="500" x2="180" y2="460"/>
    <line x1="300" y1="500" x2="100" y2="350"/>
    <path d="M300,500 C320,470 280,470 300,500"/>

    <!-- Nodo 7 -->
    <line x1="180" y1="460" x2="420" y2="460"/>
    <line x1="180" y1="460" x2="300" y2="500"/>
    <line x1="180" y1="460" x2="100" y2="350"/>
    <line x1="180" y1="460" x2="100" y2="250"/>
    <path d="M180,460 C200,430 160,430 180,460"/>

    <!-- Nodo 8 -->
    <line x1="100" y1="350" x2="300" y2="500"/>
    <line x1="100" y1="350" x2="180" y2="460"/>
    <line x1="100" y1="350" x2="100" y2="250"/>
    <line x1="100" y1="350" x2="180" y2="140"/>
    <path d="M100,350 C120,320 80,320 100,350"/>

    <!-- Nodo 9 -->
    <line x1="100" y1="250" x2="180" y2="460"/>
    <line x1="100" y1="250" x2="100" y2="350"/>
    <line x1="100" y1="250" x2="180" y2="140"/>
    <line x1="100" y1="250" x2="300" y2="100"/>
    <path d="M100,250 C120,220 80,220 100,250"/>

    <!-- Nodo 10 -->
    <line x1="180" y1="140" x2="100" y2="350"/>
    <line x1="180" y1="140" x2="100" y2="250"/>
    <line x1="180" y1="140" x2="300" y2="100"/>
    <path d="M180,140 C200,110 160,110 180,140"/>
